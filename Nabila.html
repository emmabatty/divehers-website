        <h2>Story 08</h2>
        <h1>Nabila Ayu Fitriani</h1>
        <p class="profile-meta">
          <span>📍 Banda Neira, Indonesia</span>
          <span>🌊 Marine Biologist & Coral Restoration Specialist</span>
        </p>
        <p>
          Nabila Ayu Fitriani is a dedicated Marine Biologist at Luminocean Marine Conservation, specializing in coral restoration, spawning research, and women's empowerment. Her work focuses on coral spawning and larval propagation-based restoration, with the long-term goal of building a national coral spawning network to strengthen restoration efforts across Indonesia.
        </p>
        <p>
          As a certified Coral Instructor through Ocean Gardener and a Reef Check Ecodiver Trainer, Nabila brings extensive field expertise in coral identification, transplantation techniques, and reef monitoring — supported by over 300 logged dives throughout Indonesia's diverse reefs. Beyond her scientific contributions, Nabila serves as a Coral Catch Superwoman, leading initiatives in Banda Neira to empower local women through storytelling, mentorship, and marine conservation training.
        </p>
        <p>
          Her work beautifully bridges science, education, and community engagement, driving a more sustainable and inclusive future for Indonesia's oceans. Use Nabila's story to inspire conversations about scientific leadership, coral restoration innovation, and women-centered conservation models.
        </p>
